<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>TOOL THIÊN TRẦN</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust:100%; text-size-adjust:100%; font-size:16px; }
  html, body { height:100%; overscroll-behavior:none; }
  body {
    background:#050507; color:#cfcfcf;
    font-family:'Courier New',ui-monospace,monospace;
    padding:20px; position:relative; overflow-x:hidden;
    min-height:100vh; touch-action:pan-y;
    -webkit-user-select:none; user-select:none;
  }
  #hexbg,#hexbg2,#hexbg3 {
    position:fixed; inset:0; z-index:0; white-space:pre; overflow:hidden;
    pointer-events:none; user-select:none; font-family:'Courier New',monospace;
  }
  #hexbg  { color:#ff2d55; opacity:.07;  font-size:11px; line-height:1.35; }
  #hexbg2 { color:#00ff9c; opacity:.03;  font-size:10px; line-height:1.3;  }
  #hexbg3 { color:#4af;    opacity:.025; font-size:9px;  line-height:1.25; }
  #scanlines {
    position:fixed; inset:0; z-index:2; pointer-events:none;
    background:repeating-linear-gradient(to bottom,
      rgba(255,255,255,.02) 0, rgba(255,255,255,.02) 1px,
      transparent 1px, transparent 3px);
    mix-blend-mode:overlay;
  }
  #vignette {
    position:fixed; inset:0; z-index:2; pointer-events:none;
    background:radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,.7) 100%);
  }
  .wrap { position:relative; z-index:3; max-width:1100px; margin:0 auto; }

  .header {
    display:flex; align-items:center; gap:16px;
    margin-bottom:22px; padding-bottom:16px;
    border-bottom:1px solid #2a0a14; position:relative;
  }
  .header::after {
    content:''; position:absolute; bottom:-1px; left:0;
    width:40%; height:1px; background:#ff2d55; box-shadow:0 0 8px #ff2d55;
  }
  .header .gif {
    width:66px; height:66px; object-fit:cover;
    border:1px solid #ff2d55; border-radius:8px; background:#0a0a0a;
    box-shadow:0 0 12px rgba(255,45,85,.45);
  }
  .header .title {
    font-size:22px; font-weight:bold; color:#ff2d55;
    letter-spacing:4px; text-transform:uppercase;
    text-shadow:0 0 10px rgba(255,45,85,.6);
  }
  .header .sub { font-size:11px; color:#5a5a5a; letter-spacing:1px; margin-top:4px; }

  .tabs { display:flex; gap:8px; margin-bottom:18px; flex-wrap:wrap; }
  .tab {
    padding:10px 22px; background:#0d0d0f; border:1px solid #222;
    color:#666; cursor:pointer; font-family:inherit; font-size:13px;
    transition:all .18s;
  }
  .tab.active {
    background:#ff2d55; color:#000; border-color:#ff2d55;
    font-weight:bold; box-shadow:0 0 14px rgba(255,45,85,.5);
  }
  .tab:hover:not(.active) { border-color:#ff2d55; color:#ff2d55; }

  .panel { display:none; }
  .panel.active { display:block; animation:fadeIn .2s ease; }
  @keyframes fadeIn { from{opacity:0;transform:translateY(4px)} to{opacity:1;transform:none} }

  .dropzone {
    border:2px dashed #222; padding:40px; text-align:center;
    color:#555; cursor:pointer; transition:all .18s; margin-bottom:16px;
    background:#08080a;
  }
  .dropzone:hover, .dropzone.drag {
    border-color:#ff2d55; color:#ff2d55; background:#12030a;
    box-shadow:inset 0 0 20px rgba(255,45,85,.1);
  }
  .dropzone input { display:none; }

  .info {
    background:#0d0d0f; padding:12px; margin-bottom:16px;
    border-left:3px solid #ff2d55; font-size:12px; color:#aaa;
  }
  .info span { color:#ff2d55; }

  .toolbar { display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap; }
  button {
    padding:8px 16px; background:#0d0d0f; border:1px solid #222;
    color:#cfcfcf; cursor:pointer; font-family:inherit; font-size:12px;
    transition:all .18s;
  }
  button:hover { border-color:#ff2d55; color:#ff2d55; box-shadow:0 0 8px rgba(255,45,85,.3); }
  button.primary { background:#ff2d55; color:#000; border-color:#ff2d55; font-weight:bold; }
  button.primary:hover { background:#ff4066; }
  button:disabled { opacity:.35; cursor:not-allowed; }
  button:disabled:hover { border-color:#222; color:#cfcfcf; box-shadow:none; }

  .viewer {
    background:#000; border:1px solid #222; padding:12px;
    height:460px; overflow:auto; font-size:12px; line-height:1.5;
    white-space:pre; color:#888;
  }
  .viewer .addr { color:#333; user-select:none; }
  .viewer .hex { color:#4af; }
  .viewer .ascii { color:#aaa; }
  .viewer .str { color:#3f3; }

  .log {
    background:#000; border:1px solid #222; padding:12px;
    height:220px; overflow:auto; font-size:12px; color:#888;
    margin-top:14px;
  }
  .log .ok { color:#3f3; }
  .log .err { color:#ff2d55; }
  .log .warn { color:#fa3; }
  .section-label {
    margin:18px 0 10px; color:#ff2d55; font-size:12px;
    letter-spacing:2px; text-transform:uppercase;
  }

  .sq-grid {
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(120px, 1fr));
    gap:12px; margin-top:8px;
  }
  .sq-btn {
    aspect-ratio:1/1; padding:10px;
    background:#0d0d0f; border:1px solid #222;
    color:#cfcfcf; cursor:pointer; font-family:inherit;
    font-size:11px; line-height:1.35;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    text-align:center; transition:all .18s;
    position:relative; overflow:hidden;
  }
  .sq-btn::before {
    content:''; position:absolute; inset:0;
    background:linear-gradient(135deg, transparent, rgba(255,45,85,.06));
    opacity:0; transition:opacity .2s;
  }
  .sq-btn:hover::before { opacity:1; }
  .sq-btn:hover {
    border-color:#ff2d55; color:#ff2d55;
    box-shadow:0 0 16px rgba(255,45,85,.35);
    transform:translateY(-2px);
  }
  .sq-btn:active { transform:translateY(0); }
  .sq-btn:disabled { opacity:.3; cursor:not-allowed; }
  .sq-btn:disabled:hover { border-color:#222; color:#cfcfcf; box-shadow:none; transform:none; }
  .sq-btn:disabled:hover::before { opacity:0; }
  .sq-btn .icon { font-size:18px; margin-bottom:6px; opacity:.8; }
  .sq-btn .label { font-weight:bold; }
  .sq-btn .sub { font-size:9px; color:#666; margin-top:4px; }
  .sq-btn:hover .sub { color:#ff2d55; }
</style>
</head>
<body>

<div id="hexbg"></div>
<div id="hexbg2"></div>
<div id="hexbg3"></div>
<div id="scanlines"></div>
<div id="vignette"></div>

<div class="wrap">
  <div class="header">
    <img class="gif" src="https://media.giphy.com/media/3o7TKSjRrfIPjeiVyM/giphy.gif" alt="gif"
         onerror="this.style.display='none'">
    <div>
      <div class="title">TOOL THIÊN TRẦN</div>
      <div class="sub">// vex build // upload · view · inject</div>
    </div>
  </div>

  <div class="tabs">
    <div class="tab active" data-tab="1">tab 1 // xem code</div>
    <div class="tab" data-tab="2">tab 2 // bơm code</div>
  </div>

  <div class="panel active" id="panel-1">
    <div class="dropzone" id="dz1">
      <input type="file" id="file1" accept=".bin,.so,.dll,.exe">
      <div>drop .bin / .so ở đây hoặc click // max 100MB</div>
    </div>
    <div class="info" id="info1" style="display:none"></div>
    <div class="toolbar">
      <button data-view="hex">hex view</button>
      <button data-view="ascii">ascii</button>
      <button data-view="strings">strings</button>
      <button id="dl1" disabled>download raw</button>
    </div>
    <div class="viewer" id="viewer1">// chưa có file. upload đi nerd.</div>
  </div>

  <div class="panel" id="panel-2">
    <div class="dropzone" id="dz2">
      <input type="file" id="file2" accept=".bin,.so,.dll,.exe">
      <div>drop file để bơm code // .bin / .so</div>
    </div>
    <div class="info" id="info2" style="display:none"></div>

    <div class="section-label">// chọn kiểu bơm</div>
    <div class="sq-grid">
      <button class="sq-btn" id="inject-belly" disabled>
        <div class="icon">⌖</div>
        <div class="label">bơm code</div>
        <div class="sub">aim bụng</div>
      </button>
      <button class="sq-btn" id="inject-neck" disabled>
        <div class="icon">☰</div>
        <div class="label">bơm aim</div>
        <div class="sub">neck nhẹ</div>
      </button>
      <button class="sq-btn" id="inject-drag" disabled>
        <div class="icon">✛</div>
        <div class="label">bơm code</div>
        <div class="sub">aim drag</div>
      </button>
    </div>

    <div class="toolbar" style="margin-top:18px">
      <button id="dl2" disabled>download file đã chỉnh sửa</button>
    </div>
    <div class="log" id="log2">// log sẽ hiện ở đây</div>
  </div>
</div>

<script>
(function(){
'use strict';

const $ = id => document.getElementById(id);

/* ===== nền hex 3 lớp ===== */
function startHexLayer(id, lines, cols, interval) {
  const el = $(id); if (!el) return;
  const HEX = '0123456789abcdef';
  const rb = () => HEX[(Math.random()*16)|0] + HEX[(Math.random()*16)|0];
  const mk = () => { let s=''; for (let c=0;c<cols;c++) s += rb()+' '; return s; };
  const rows = []; for (let i=0;i<lines;i++) rows.push(mk());
  el.textContent = rows.join('\n');
  setInterval(() => { rows.shift(); rows.push(mk()); el.textContent = rows.join('\n'); }, interval);
}
startHexLayer('hexbg',  90, 80,  80);
startHexLayer('hexbg2', 110, 90, 130);
startHexLayer('hexbg3', 130, 110, 200);

/* ===== chống zoom ===== */
window.addEventListener('wheel', e => { if (e.ctrlKey) e.preventDefault(); }, { passive:false });
window.addEventListener('keydown', e => {
  if (e.ctrlKey && ['+','-','=','0'].includes(e.key)) e.preventDefault();
});
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('gesturechange', e => e.preventDefault());
document.addEventListener('gestureend', e => e.preventDefault());
let lastTouch = 0;
document.addEventListener('touchend', e => {
  const now = Date.now();
  if (now - lastTouch < 300) e.preventDefault();
  lastTouch = now;
}, { passive:false });

/* ===== TABS — fix chắc chắn chuyển được ===== */
const tabEls = document.querySelectorAll('.tab');
const panelEls = document.querySelectorAll('.panel');
tabEls.forEach(t => {
  t.addEventListener('click', function(){
    const id = this.getAttribute('data-tab');
    tabEls.forEach(x => x.classList.remove('active'));
    panelEls.forEach(x => x.classList.remove('active'));
    this.classList.add('active');
    const p = document.getElementById('panel-' + id);
    if (p) p.classList.add('active');
  });
});

/* ===== STATE ===== */
const state = { buf1:null, name1:null, buf2:null, name2:null, patched:null };

/* ===== DROPZONE — fix upload chắc chắn chạy ===== */
function wireDrop(dzId, inputId, onFile) {
  const dz = $(dzId), input = $(inputId);
  if (!dz || !input) return;

  dz.addEventListener('click', function(e){
    if (e.target === input) return;
    input.click();
  });

  input.addEventListener('change', function(){
    const f = this.files && this.files[0];
    if (f) onFile(f);
    this.value = '';
  });

  let dragCounter = 0;
  dz.addEventListener('dragenter', e => { e.preventDefault(); dragCounter++; dz.classList.add('drag'); });
  dz.addEventListener('dragover',  e => { e.preventDefault(); });
  dz.addEventListener('dragleave', e => {
    e.preventDefault(); dragCounter--;
    if (dragCounter <= 0) { dragCounter = 0; dz.classList.remove('drag'); }
  });
  dz.addEventListener('drop', e => {
    e.preventDefault(); dragCounter = 0; dz.classList.remove('drag');
    const f = e.dataTransfer.files && e.dataTransfer.files[0];
    if (f) onFile(f);
  });
}

/* tab1 upload */
wireDrop('dz1','file1', function(f){
  if (f.size > 100*1024*1024) { $('viewer1').textContent = 'file > 100MB. sybau.'; return; }
  const reader = new FileReader();
  reader.onload = function(){
    state.buf1 = new Uint8Array(reader.result);
    state.name1 = f.name;
    renderInfo('info1', f, state.buf1);
    renderHex($('viewer1'), state.buf1);
    $('dl1').disabled = false;
  };
  reader.readAsArrayBuffer(f);
});

/* tab2 upload */
wireDrop('dz2','file2', function(f){
  if (f.size > 100*1024*1024) { log('file > 100MB. sybau.','err'); return; }
  const reader = new FileReader();
  reader.onload = function(){
    state.buf2 = new Uint8Array(reader.result);
    state.name2 = f.name;
    state.patched = null;
    renderInfo('info2', f, state.buf2);
    $('inject-belly').disabled = false;
    $('inject-neck').disabled = false;
    $('inject-drag').disabled = false;
    $('dl2').disabled = true;
    log('loaded ' + f.name + ' // ' + f.size + ' bytes','ok');
  };
  reader.readAsArrayBuffer(f);
});

function renderInfo(id, f, buf) {
  const el = $(id);
  el.style.display = 'block';
  el.innerHTML = '<span>' + f.name + '</span> // ' + f.size + ' bytes // magic: <span>' + magic(buf) + '</span>';
}
function magic(b) {
  const h = [...b.slice(0,4)].map(x=>x.toString(16).padStart(2,'0')).join(' ');
  if (b[0]===0x7f && b[1]===0x45) return 'ELF ('+h+')';
  if (b[0]===0x4d && b[1]===0x5a) return 'PE/MZ ('+h+')';
  return h;
}

/* ===== tab1 viewers ===== */
document.querySelectorAll('[data-view]').forEach(b => {
  b.addEventListener('click', function(){
    if (!state.buf1) return;
    const v = this.getAttribute('data-view');
    if (v === 'hex') renderHex($('viewer1'), state.buf1);
    else if (v === 'ascii') renderAscii($('viewer1'), state.buf1);
    else renderStrings($('viewer1'), state.buf1);
  });
});

const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

function renderHex(el, buf) {
  const lines = [];
  const max = Math.min(buf.length, 100*1024);
  for (let i = 0; i < max; i += 16) {
    const c = buf.slice(i, i+16);
    const hex = [...c].map(x=>x.toString(16).padStart(2,'0')).join(' ');
    const ascii = [...c].map(x=>x>=32&&x<127?String.fromCharCode(x):'.').join('');
    const addr = i.toString(16).padStart(8,'0');
    lines.push('<span class="addr">'+addr+'</span>  <span class="hex">'+hex.padEnd(47)+'</span>  <span class="ascii">'+esc(ascii)+'</span>');
  }
  if (buf.length > max) lines.push('<span class="warn">... truncated at '+max+' ('+buf.length+' total)</span>');
  el.innerHTML = lines.join('\n');
}
function renderAscii(el, buf) {
  const max = Math.min(buf.length, 200*1024);
  let out = '';
  for (let i = 0; i < max; i++) {
    const c = buf[i];
    out += (c>=32&&c<127)?String.fromCharCode(c):(c===10?'\n':'·');
  }
  el.textContent = out;
}
function renderStrings(el, buf) {
  const out = []; let cur = '', start = 0;
  for (let i = 0; i < buf.length; i++) {
    const c = buf[i];
    if (c>=32 && c<127) { if (!cur) start = i; cur += String.fromCharCode(c); }
    else { if (cur.length >= 4) out.push({off:start, s:cur}); cur = ''; }
  }
  if (cur.length >= 4) out.push({off:start, s:cur});
  el.innerHTML = out.length
    ? out.map(x=>'<span class="addr">0x'+x.off.toString(16).padStart(8,'0')+'</span>  <span class="str">'+esc(x.s)+'</span>').join('\n')
    : '// không thấy string nào >= 4 ký tự.';
}

$('dl1').addEventListener('click', function(){ if (state.buf1) dl(state.buf1, state.name1); });

/* =========================================================
   PATCH ENGINE
   ========================================================= */
const enc = s => new TextEncoder().encode(s);

function findAll(buf, needle) {
  const out = [];
  const nl = needle.length;
  if (!nl) return out;
  outer: for (let i = 0; i <= buf.length - nl; i++) {
    for (let j = 0; j < nl; j++) {
      if (buf[i+j] !== needle[j]) continue outer;
    }
    out.push(i);
  }
  return out;
}

/* aim bụng: 3 chiều, đúng 100%, giữ size file tuyệt đối */
function doBellyPatch() {
  if (!state.buf2) return log('chưa upload file.','err');
  if (!confirm('chắc chắn bơm code aim bụng?')) return log('hủy bơm aim bụng','warn');

  log('bơm code aim bụng...','warn');

  const out = new Uint8Array(state.buf2);
  const rules = [
    { from: 'bone_Neck',  to: 'bone_Spine' },
    { from: 'bone_Spine', to: 'bone_Head'  },
    { from: 'bone_Head',  to: 'bone_Neck'  },
  ];

  // token trung gian, cùng length with from, không chain
  const tokens = rules.map((r, i) => ({
    from: r.from,
    to: r.to,
    idx: i,
    token: new Uint8Array(r.from.length).fill(0x01 + i),
    count: 0
  }));

  // PASS 1: from -> token
  tokens.forEach(t => {
    const needle = enc(t.from);
    const hits = findAll(out, needle);
    t.count = hits.length;
    for (const pos of hits) out.set(t.token, pos);
  });

  // PASS 2: token -> to (ghi tối đa length of from, pad \x00 nếu thiếu)
  tokens.forEach(t => {
    const hits = findAll(out, t.token);
    const toBytes = enc(t.to);
    const fromLen = t.from.length;
    for (const pos of hits) {
      const n = Math.min(toBytes.length, fromLen);
      for (let k = 0; k < n; k++) out[pos + k] = toBytes[k];
      for (let k = n; k < fromLen; k++) out[pos + k] = 0x00;
    }
  });

  const total = tokens.reduce((a,t)=>a+t.count,0);
  tokens.forEach(t => log(t.from + ' -> ' + t.to + ' : ' + t.count + ' chỗ', t.count ? 'ok' : 'warn'));
  if (total === 0) log('không tìm thấy bone nào. file nén?','err');
  else log('tổng ' + total + ' swap. done.','ok');

  state.patched = out;
  $('dl2').disabled = false;
  log('in:  ' + state.buf2.length + ' bytes','ok');
  log('out: ' + out.length + ' bytes','ok');
  log(out.length === state.buf2.length ? 'dung lượng giữ nguyên ✔' : 'dung lượng lệch','warn');
}

/* aim neck nhẹ: bone_Neck -> bone_Head */
function doNeckPatch() {
  if (!state.buf2) return log('chưa upload file.','err');
  if (!confirm('chắc chắn bơm aim neck nhẹ?')) return log('hủy bơm aim neck nhẹ','warn');

  log('bơm aim neck nhẹ...','warn');
  const out = new Uint8Array(state.buf2);
  const from = enc('bone_Neck');
  const to   = enc('bone_Head');
  const hits = findAll(out, from);
  for (const pos of hits) out.set(to, pos);
  log('bone_Neck -> bone_Head : ' + hits.length + ' chỗ', hits.length ? 'ok' : 'warn');

  state.patched = out;
  $('dl2').disabled = false;
  log('in:  ' + state.buf2.length + ' bytes','ok');
  log('out: ' + out.length + ' bytes','ok');
  log(out.length === state.buf2.length ? 'dung lượng giữ nguyên ✔' : 'dung lượng lệch','warn');
}

/* aim drag: ghi bytes HEX vào 0x7148 */
const DRAG_OFFSET = 0x7148;
const DRAG_BYTES = new Uint8Array([
  0x31,0x69,0x74,0xEB,0x89,0x29,0xC5,0xBE,
  0x16,0xDC,0x98,0xBD,0xBB,0x82,0x97,0xB4,
  0x00,0x00,0x00,0x00,0xBF,0xB2,0x2F,0x3F,
  0x43,0x32,0x73,0x36,0x66,0x03,0x7B,0x35,
  0x72,0x1C,0xC7,0x3F,0x72,0x1C,0xC7,0x3F,
  0x72,0x1C,0xC7,0x3F,0x10,0x00,0x00,0x00,
  0x62,0x6F,0x6E,0x65,0x5F,0x48,0x65,0x61,
  0x64,0x00,0x00,0x00,0x00,0x00,0x00,0x00,
  0x23,0xAA,0xA6,0xB8,0xB2,0xF7,0x1F,0xA4,
]);

function doDragPatch() {
  if (!state.buf2) return log('chưa upload file.','err');
  if (!confirm('chắc chắn bơm code aim drag? ghi ' + DRAG_BYTES.length + ' bytes @ 0x' + DRAG_OFFSET.toString(16)))
    return log('hủy bơm aim drag','warn');

  log('bơm code aim drag...','warn');
  const out = new Uint8Array(state.buf2);
  const need = DRAG_OFFSET + DRAG_BYTES.length;
  if (need > out.length) {
    log('file quá nhỏ: cần >= 0x' + need.toString(16) + ' (' + need + ' bytes), file có ' + out.length,'err');
    return;
  }

  const oldBytes = out.slice(DRAG_OFFSET, DRAG_OFFSET + DRAG_BYTES.length);
  log('bytes cũ @0x7148: ' + hexStr(oldBytes), 'warn');

  out.set(DRAG_BYTES, DRAG_OFFSET);

  log('đã ghi ' + DRAG_BYTES.length + ' bytes @0x' + DRAG_OFFSET.toString(16),'ok');
  log('bytes mới @0x7148: ' + hexStr(DRAG_BYTES), 'ok');

  state.patched = out;
  $('dl2').disabled = false;
  log('in:  ' + state.buf2.length + ' bytes','ok');
  log('out: ' + out.length + ' bytes','ok');
  log(out.length === state.buf2.length ? 'dung lượng giữ nguyên ✔' : 'dung lượng lệch','warn');
}

function hexStr(bytes) {
  return [...bytes].map(x => x.toString(16).padStart(2,'0').toUpperCase()).join(' ');
